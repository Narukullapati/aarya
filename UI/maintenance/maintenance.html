<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>We'll be right back — aarya</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "IBM Plex Mono", "Courier New", monospace;
    background: #fff;
    color: #16a34a;
    padding: 24px;
  }
  .card {
    max-width: 460px;
    width: 100%;
    text-align: left;
    border: 1px solid #16a34a;
    padding: 48px 32px;
    position: relative;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 88px;
    height: 10px;
    background: #16a34a;
  }
  .label {
    font-weight: 300;
    font-size: 12px;
    letter-spacing: -0.3px;
    text-transform: uppercase;
    margin-bottom: 24px;
    opacity: .6;
  }
  h1 {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 700;
    font-size: 40px;
    letter-spacing: -0.04em;
    line-height: .9;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  p {
    font-weight: 300;
    font-size: 14px;
    line-height: 1.5;
  }
  .foot {
    margin-top: 32px;
    font-size: 11px;
    opacity: .5;
  }
</style>
</head>
<body>
  <div class="card">
    <p class="label">aarya.narukullapati.com</p>
    <h1>Under<br>maintenance</h1>
    <p>Deploying a new version. Back in a minute — retry shortly.</p>
    <p class="foot">© 2026 Aarya.</p>
  </div>
</body>
</html>
