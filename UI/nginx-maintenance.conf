# Maintenance-mode server — used by the aarya-maintenance container.
# Serves the maintenance page (503 + Retry-After) for every request while the
# real UI container is down for a deployment.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Never let anything cache the maintenance page
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Retry-After "600" always;

    location / {
        return 503;
    }

    error_page 503 /maintenance.html;
    location = /maintenance.html {
        internal;
    }
}
