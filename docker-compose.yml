services:
  api:
    build: ./API
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=${DB_HOST:?set DB_HOST in .env}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:?set DB_NAME in .env}
      - DB_USER=${DB_USER:?set DB_USER in .env}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - AUDIT_ADMIN_TOKEN=${AUDIT_ADMIN_TOKEN:-}
      - EDIT_TOKEN=${EDIT_TOKEN:-}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads:/app/uploads

  ui:
    build: ./UI
    ports:
      - "8080:80"
    depends_on:
      - api

  # Fallback maintenance page — Traefik routes to it only when the ui router
  # disappears (container down during a deploy): lower router priority.
  maintenance:
    image: nginx:alpine
    volumes:
      - ./UI/maintenance:/usr/share/nginx/html:ro
      - ./UI/nginx-maintenance.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  uploads:
