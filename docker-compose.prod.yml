# Production override for the VPS (srv1076274.hstgr.cloud, 72.60.175.59).
# Traefik runs on the host network there (docker provider, exposedbydefault=false,
# letsencrypt resolver) — containers are reached via their bridge IPs, so no
# host ports are published.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  api:
    ports: !reset []
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.aarya-api.rule: "Host(`api.aarya.narukullapati.com`)"
      traefik.http.routers.aarya-api.entrypoints: "websecure"
      traefik.http.routers.aarya-api.tls.certresolver: "letsencrypt"
      traefik.http.services.aarya-api.loadbalancer.server.port: "8000"

  ui:
    ports: !reset []
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.aarya.rule: "Host(`aarya.narukullapati.com`)"
      traefik.http.routers.aarya.priority: "10"
      traefik.http.routers.aarya.entrypoints: "websecure"
      traefik.http.routers.aarya.tls: "true"
      traefik.http.routers.aarya.tls.certresolver: "letsencrypt"
      traefik.http.services.aarya.loadbalancer.server.port: "80"

  maintenance:
    labels:
      traefik.enable: "true"
      traefik.http.routers.aarya-maintenance.rule: "Host(`aarya.narukullapati.com`)"
      traefik.http.routers.aarya-maintenance.priority: "1"
      traefik.http.routers.aarya-maintenance.entrypoints: "websecure"
      traefik.http.routers.aarya-maintenance.tls: "true"
      traefik.http.routers.aarya-maintenance.tls.certresolver: "letsencrypt"
      traefik.http.services.aarya-maintenance.loadbalancer.server.port: "80"
